name: Editable Icon Studio acceptance
on:
  push:
    branches: [work/journey-icon-studio]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          python -m pip install Pillow==12.2.0 ziglang==0.15.2
          python -m pip download --only-binary=:all: --platform win_amd64 --python-version 3.14 --implementation cp --abi cp314 --dest "$env:RUNNER_TEMP" Pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed.' }
      - name: Build portable editor workspace
        run: |
          python -B tools/build_icon_studio.py dist --cache "$env:RUNNER_TEMP/icon-studio-cache" --wheel "$env:RUNNER_TEMP/pillow-12.2.0-cp314-cp314-win_amd64.whl"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Studio build failed.' }
      - name: Verify real Inkscape exports and native Windows icons
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'Icon Studio acceptance with spaces'
          Expand-Archive dist/Journey-Icon-Studio-Windows-x64.zip -DestinationPath $candidate
          $package = Join-Path $candidate 'Journey Icon Studio'
          $env:JOURNEY_ICON_INKSCAPE = Join-Path $package 'inkscape/bin/inkscape.exe'
          $env:PYTHONPATH = (Get-Location).Path
          python -B -m unittest discover -s tests -p 'test_icon_studio.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Editable project / ICO tests failed.' }
          & (Join-Path $package 'runtime/python.exe') -B tests/icon_studio/installed_acceptance.py "$package" "$env:RUNNER_TEMP/studio-fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled native GUI or Windows icon acceptance failed.' }
      - name: Preserve verified editor
        uses: actions/upload-artifact@v4
        with:
          name: verified-icon-studio-windows
          path: dist/Journey-Icon-Studio-Windows-x64.zip
          if-no-files-found: error
