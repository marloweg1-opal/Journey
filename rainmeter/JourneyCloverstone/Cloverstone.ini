[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
WindowX=657
WindowY=290
AlwaysOnTop=-2
Draggable=0
ClickThrough=0
KeepOnScreen=1
Group=Journey

[Metadata]
Name=Journey Cloverstone Launcher
Author=Journey
Information=Invisible click target over the Cloverstone badge on the CareBloom desktop.
Version=1.0.0

[Variables]
JourneyRoot=C:\mini_ark

[CloverstoneButton]
Meter=Shape
X=0
Y=0
W=145
H=165
Shape=Ellipse 72,82,68,68 | Fill Color 84,255,141,1 | StrokeWidth 0
LeftMouseUpAction=["powershell.exe" "-NoProfile" "-ExecutionPolicy" "Bypass" "-File" "#JourneyRoot#\start_mini_ark.ps1" "-Open"]
MouseOverAction=[!SetOption CloverstoneButton Shape "Ellipse 72,82,68,68 | Fill Color 84,255,141,18 | Stroke Color 176,255,201,80 | StrokeWidth 2"][!UpdateMeter CloverstoneButton][!Redraw]
MouseLeaveAction=[!SetOption CloverstoneButton Shape "Ellipse 72,82,68,68 | Fill Color 84,255,141,1 | StrokeWidth 0"][!UpdateMeter CloverstoneButton][!Redraw]
ToolTipText=Open Journey
DynamicVariables=1
